# Default values for hello-spring-app
replicaCount: 2

image:
  repository: ${IMAGE_NAME}
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# Spring Boot специфичные настройки
spring:
  app:
    name: "hello-spring-app"
    port: 8080
  profiles: "prod"
  config:
    import: "optional:configserver:"
  cloud:
    kubernetes:
      enabled: false

  datasource:
    url: "jdbc:postgresql://postgresql:5432/mydb"
    username: "appuser"
    driverClassName: "org.postgresql.Driver"

  jpa:
    hibernate:
      ddl-auto: "validate"
    show-sql: "false"

  redis:
    host: "redis-master"
    port: 6379

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: hello-spring.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "1024Mi"
    cpu: "500m"

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Зависимости
postgresql:
  enabled: false
  auth:
    database: "mydb"
    username: "appuser"
    password: ""

redis:
  enabled: false
  auth:
    password: ""

# Spring Cloud Config Server (опционально)
configserver:
  enabled: false
  url: "http://config-server:8888"

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
      base-path: "/actuator"
  endpoint:
    health:
      show-details: "always"
      probes:
        enabled: true

nodeSelector: {}
tolerations: []
affinity: {}
